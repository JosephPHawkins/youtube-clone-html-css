<!DOCTYPE html>

<html>
  <head>
    <title>image practice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <img class="cat-tongue-round" src="images/cute-cat.png" />
    <img class="cat-tongue-square" src="images/cute-cat.png" />
    <img class="cat-tongue-circle" src="images/cute-cat.png" />

    <div></div>

    <input class="search-rounded-corners" type="text" placeholder="Search" />
    <input
      class="search-rounded-long"
      type="text"
      placeholder="Search Google or Type a URL"
    />

    <div class="whats-happening">
      <img
        id="smaller-circle"
        class="cat-tongue-circle"
        src="images/cute-cat.png"
      />
      <input placeholder="What's happening" class="search-email" type="text" />

      <button class="tweet-button">Tweet</button>
    </div>

    <div class="add-friend">
      <img
        src="images/bewford.jpeg"
        alt="a picture of a cat with a double chin"
      />
      <p id="name">Bewford</p>
      <p id="friends">2 mutal friends</p>
      <button id="add-friend-button">Add Friend</button>
    </div>

    <div class="add-friend">
      <img src="images/cute-fellow.jpeg" alt="smiling kitty" />
      <p id="name">Mimi</p>
      <p id="friends">5 mutal friends</p>
      <button id="add-friend-button">Add Friend</button>
    </div>

    <div class="add-friend">
      <img
        src="images/gooby.png"
        alt="cat 2 inches away from the camera looking funny"
      />
      <p id="name">Gooby</p>
      <p id="friends">0 mutal friends</p>
      <button id="add-friend-button">Add Friend</button>
    </div>
  </body>
</html>
