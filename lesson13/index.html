<!DOCTYPE html>
<html>
  <head>
    <title>Nested flexbox practice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="flexbox-two-elements">
      <div class="flex-item1">
        <p class="item1">item1</p>
      </div>
      <div class="flex-item2"></div>
    </div>

    <div class="row-two-section">
      <div class="flexbox-two-elements">
        <div class="flex-item1"></div>

        <div class="flex-item2">
          <div class="row1">
            <p>row1</p>
          </div>
          <div class="row2">
            <p class="item-row2">row2</p>
            <p class="item-row2">row2</p>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
