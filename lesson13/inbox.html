<!DOCTYPE html>
<html>
  <head>
    <title>Nested flexbox practice</title>
    <link rel="stylesheet" href="inbox_styles.css" />
  </head>
  <body>
    <div class="gmail-message-section">
      <div class="inboxe">ALL INBOXES</div>

      <div class="message">
        <div class="pfp-img">
          <img
            class="img"
            src="pfp-images/staring-cat.webp"
            alt="starting-cat"
          />
        </div>
        <div class="message-info">
          <div class="title-time">
            <div class="title">Save A LIFE</div>
            <div class="time">2:38 AM</div>
          </div>
          <div class="subtitle">You have a chance to save someone</div>
          <div class="desc">
            Hey there! Noticed you didnt eat all your cat foo...
          </div>
        </div>
      </div>

      <div class="message">
        <div class="pfp-img">
          <img
            class="img"
            src="pfp-images/gobby.png"
            alt="cat nose two feet from camera"
          />
        </div>
        <div class="message-info">
          <div class="title-time">
            <div class="title">Is This Google</div>
            <div class="time">12:01pm</div>
          </div>
          <div class="subtitle">my sons hungry</div>
          <div class="desc">
            Hello google, how do i google my son, i think hes hungry
          </div>
        </div>
      </div>

      <div class="message">
        <div class="pfp-img">
          <img class="img" src="pfp-images/cute.jpeg" alt="cute smiling cat" />
        </div>
        <div class="message-info">
          <div class="title-time">
            <div class="title">Heyyy!!!</div>
            <div class="time">3:45pm</div>
          </div>
          <div class="subtitle">Venmo me 100$</div>
          <div class="desc">Saw you won the lotteraly</div>
        </div>
      </div>
    </div>
  </body>
</html>
