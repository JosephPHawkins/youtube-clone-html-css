<!DOCTYPE html>
<html>
  <head>
    <title>Grid Prcatice</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="friend-grid">
      <div class="friend-section">
        <div class="friend-pfp">
          <img class="friend-pfp-img" src="images/angry-cat.jpeg" />
        </div>

        <div class="info-section">
          <div>
            <p class="friend-name">Oliver</p>
          </div>

          <div>
            <div class="pfp-section">
              <img
                class="pfp-img"
                src="images/crying-cat.webp"
                alt="crying baby cat"
              />
            </div>
            <div class="number-friends">
              <p>2 mutal friends</p>
            </div>
          </div>

          <div class="button-section">
            <button class="button-design">Add Friend</button>
          </div>
        </div>
      </div>

      <div class="friend-section">
        <div class="friend-pfp">
          <img class="friend-pfp-img" src="images/Mr._Shock.webp" />
        </div>

        <div class="info-section">
          <div>
            <p class="friend-name">pickle</p>
          </div>

          <div>
            <div class="pfp-section">
              <img
                class="pfp-img"
                src="images/crying-cat.webp"
                alt="crying baby cat"
              />
            </div>
            <div class="number-friends">
              <p>5 mutal friends</p>
            </div>
          </div>

          <div class="button-section">
            <button class="button-design">Add Friend</button>
          </div>
        </div>
      </div>

      <div class="friend-section">
        <div class="friend-pfp">
          <img class="friend-pfp-img" src="images/staring-cat.webp" />
        </div>

        <div class="info-section">
          <div>
            <p class="friend-name">Arnold</p>
          </div>

          <div>
            <div class="pfp-section">
              <img
                class="pfp-img"
                src="images/crying-cat.webp"
                alt="crying baby cat"
              />
            </div>
            <div class="number-friends">
              <p>0 mutal friends</p>
            </div>
          </div>

          <div class="button-section">
            <button class="button-design">Add Friend</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
